<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home Hub</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171c26;
    --panel-2: #1e2532;
    --border: #2a3344;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --accent: #4da3ff;
    --on: #3ddc84;
    --off: #4a5468;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 18px; font-weight: 600; margin-right: auto; }
  header h1 span { color: var(--accent); }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .banner {
    background: #3a2b12; border: 1px solid #7a5a1e; color: #ffd479;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px;
    white-space: pre-wrap;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .card.offline { opacity: .55; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-top .icon { font-size: 22px; line-height: 1.2; }
  .card-top .meta { flex: 1; min-width: 0; }
  .card-top .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-top .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted);
  }
  .toggle {
    width: 46px; height: 26px; border-radius: 20px; border: none; cursor: pointer;
    background: var(--off); position: relative; transition: background .15s; flex-shrink: 0;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .toggle.on { background: var(--on); }
  .toggle.on::after { transform: translateX(20px); }
  .row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=color] {
    width: 34px; height: 26px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel-2); padding: 2px; cursor: pointer;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 30px 0 12px; text-transform: uppercase; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.hints { color: var(--muted); max-width: 420px; overflow-wrap: anywhere; }
  .pill { color: var(--on); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1><span>●</span> Smart Home Hub</h1>
  <button id="refreshBtn">↻ Refresh devices</button>
  <button id="scanBtn">📡 Scan network</button>
</header>
<main>
  <div id="banner" class="banner" style="display:none"></div>
  <div id="devices" class="grid"></div>
  <div id="emptyState" class="empty" style="display:none">
    No devices yet. Add credentials to <code>.env</code> (Govee / Tuya) or make sure
    Kasa devices are on this network, then hit <b>Refresh devices</b>.
  </div>
  <section id="scanSection" style="display:none">
    <h2>Network scan results</h2>
    <table>
      <thead><tr><th>IP</th><th>Name</th><th>Found via</th><th>Status</th><th>Details</th></tr></thead>
      <tbody id="scanBody"></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const ICONS = { light: '💡', plug: '🔌', switch: '🎚️', unknown: '📦' };
let debounceTimers = {};

async function api(path, opts) {
  const res = await fetch(path, opts ? {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(opts),
  } : undefined);
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

function renderDevices(data) {
  const grid = $('devices');
  grid.innerHTML = '';
  const errs = Object.entries(data.errors || {});
  const banner = $('banner');
  if (!data.adapters?.length) {
    banner.textContent = 'No adapters enabled — copy .env.example to .env and add your Govee/Tuya credentials.';
    banner.style.display = '';
  } else if (errs.length) {
    banner.textContent = errs.map(([b, e]) => `${b}: ${e}`).join('\n');
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }

  $('emptyState').style.display = data.devices.length ? 'none' : '';
  for (const d of data.devices) {
    const card = document.createElement('div');
    card.className = 'card' + (d.state.online ? '' : ' offline');
    const has = (c) => d.capabilities.includes(c);
    const rgb = d.state.color || { r: 255, g: 255, b: 255 };
    const hex = '#' + [rgb.r, rgb.g, rgb.b].map(v => v.toString(16).padStart(2, '0')).join('');
    card.innerHTML = `
      <div class="card-top">
        <div class="icon">${ICONS[d.type] || ICONS.unknown}</div>
        <div class="meta">
          <div class="name" title="${d.name}">${d.name}</div>
          <div class="sub">${d.model || ''} ${d.ip ? '· ' + d.ip : ''} ${d.state.online ? '' : '· offline'}</div>
        </div>
        <span class="badge">${d.brand}</span>
        ${has('power') ? `<button class="toggle ${d.state.on ? 'on' : ''}" data-act="power"></button>` : ''}
      </div>
      ${has('brightness') ? `
      <div class="row">🔆 <input type="range" min="1" max="100" value="${d.state.brightness ?? 100}" data-act="brightness">
        <span class="bri-label">${d.state.brightness ?? '–'}%</span></div>` : ''}
      ${has('color') ? `
      <div class="row">🎨 <input type="color" value="${hex}" data-act="color"> <span>color</span></div>` : ''}
    `;
    card.querySelector('[data-act=power]')?.addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const on = !btn.classList.contains('on');
      btn.classList.toggle('on', on);
      try { await api(`/api/devices/${encodeURIComponent(d.id)}/power`, { on }); }
      catch (err) { btn.classList.toggle('on', !on); alert(err.message); }
    });
    card.querySelector('[data-act=brightness]')?.addEventListener('input', (e) => {
      const value = Number(e.target.value);
      card.querySelector('.bri-label').textContent = value + '%';
      clearTimeout(debounceTimers[d.id + 'b']);
      debounceTimers[d.id + 'b'] = setTimeout(() => {
        api(`/api/devices/${encodeURIComponent(d.id)}/brightness`, { value }).catch(err => alert(err.message));
      }, 250);
    });
    card.querySelector('[data-act=color]')?.addEventListener('input', (e) => {
      const hex = e.target.value;
      const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      clearTimeout(debounceTimers[d.id + 'c']);
      debounceTimers[d.id + 'c'] = setTimeout(() => {
        api(`/api/devices/${encodeURIComponent(d.id)}/color`, { r, g, b }).catch(err => alert(err.message));
      }, 250);
    });
    grid.appendChild(card);
  }
}

async function load() {
  try { renderDevices(await api('/api/devices')); } catch (e) { console.error(e); }
}

$('refreshBtn').addEventListener('click', async () => {
  const btn = $('refreshBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin">↻</span> Refreshing…';
  try { renderDevices(await api('/api/devices/refresh', {})); }
  catch (e) { alert(e.message); }
  finally { btn.disabled = false; btn.innerHTML = '↻ Refresh devices'; }
});

$('scanBtn').addEventListener('click', async () => {
  const btn = $('scanBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin">📡</span> Scanning…';
  try {
    const { discovered } = await api('/api/scan', {});
    const body = $('scanBody');
    body.innerHTML = '';
    for (const h of discovered) {
      const tr = document.createElement('tr');
      const hints = Object.entries(h.hints).map(([k, v]) => `${k}: ${v}`).join(' · ');
      tr.innerHTML = `
        <td>${h.ip}</td>
        <td>${h.name || '<i>unknown</i>'}</td>
        <td>${h.sources.join(', ')}</td>
        <td>${h.managedId ? '<span class="pill">✓ controlled</span>' : 'not controlled yet'}</td>
        <td class="hints">${hints}</td>`;
      body.appendChild(tr);
    }
    if (!discovered.length) {
      body.innerHTML = '<tr><td colspan="5"><i>Nothing answered — is the hub running on the same network as your devices?</i></td></tr>';
    }
    $('scanSection').style.display = '';
  } catch (e) { alert(e.message); }
  finally { btn.disabled = false; btn.innerHTML = '📡 Scan network'; }
});

load();
setInterval(load, 15000);
</script>
</body>
</html>
